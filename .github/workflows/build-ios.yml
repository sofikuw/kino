name: Build and Release iOS

# WHY THIS WORKFLOW RUNS `flutter create`
#
# A Flutter app cannot be built without the platform scaffolding `flutter create`
# generates: ios/Runner.xcodeproj/project.pbxproj, Info.plist, Podfile,
# AppDelegate.swift, and thirty more files whose contents are Xcode-generated
# and include binary plist structures and internal UUIDs. Hand-writing them
# produces a project that looks complete and does not build.
#
# The staging environment that authored this repo has no Flutter, so those files
# could not be generated there -- and a repo missing them fails at the first
# step of every build.
#
# So the generation happens here, where Flutter exists. This repository carries
# only the Dart and this file; the scaffolding is created fresh on every run.
#
# The consequence worth stating: `flutter create` writes its own pubspec.yaml,
# which would overwrite the one here. So the order below is deliberate --
# scaffold, then copy the authored pubspec over it, then `pub get`. Getting that
# order wrong is a build that resolves none of the dependencies this app needs.

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel (anything but stable publishes as a prerelease)'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable
        default: alpha
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.47.1'
  # The Dart package name. Must match `name:` in app/pubspec.yaml, because
  # `flutter create --project-name` sets the id every `package:` import uses.
  PROJECT_NAME: kino

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      ipa_name: ${{ steps.version.outputs.ipa_name }}
      artifact_name: ${{ steps.scaffold.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scaffolds into a throwaway directory and reports what it made, so a
      # failure here is distinguishable from a failure in the Dart.
      - name: Scaffold the platform project
        id: scaffold
        run: |
          set -euo pipefail
          flutter create \
            --org sofikuw \
            --project-name "$PROJECT_NAME" \
            --platforms=ios \
            --no-pub \
            scaffold
          echo "scaffold contents:"
          ls scaffold
          echo "artifact_name=anImestream-kino-ios-unsigned" >> "$GITHUB_OUTPUT"

      # The authored Dart replaces the scaffold's. `--no-pub` above means the
      # scaffold's own lib/main.dart is inert until this point.
      #
      # These paths are root-relative: the pusher strips the `app/` prefix on the
      # way to GitHub, so in the repository this workflow's own tree IS the app.
      # Referring to `app/lib` here would fail on the first step with
      # `cp: cannot stat`, which is the loudest possible version of getting it
      # wrong -- and it WAS wrong in the first draft of this file, where the
      # pusher's prefix-stripping and these paths disagreed.
      - name: Graft the authored app onto the scaffold
        run: |
          set -euo pipefail
          rm -rf scaffold/lib
          cp -r lib scaffold/lib

          # pubspec LAST, and deliberately so: flutter create writes its own, and
          # copying the authored one before scaffolding would have it silently
          # replaced -- leaving an app that resolves none of its dependencies.
          cp pubspec.yaml scaffold/pubspec.yaml
          echo "pubspec in the build tree:"
          head -20 scaffold/pubspec.yaml
          echo "lib tree:"
          find scaffold/lib -type f | sort

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `flutter analyze` before `pub get` is deliberate: analyze needs the
      # dependency graph, so it runs after. This step is the app's only
      # compile check before the very slow xcodebuild.
      - name: Resolve dependencies
        working-directory: scaffold
        run: flutter pub get

      - name: Analyze
        working-directory: scaffold
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Version and release tag
        id: version
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.release_channel }}
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' scaffold/pubspec.yaml | head -n1)
          [ -n "$VERSION" ] || { echo "no version in pubspec.yaml"; exit 1; }

          CHANNEL="${INPUT_CHANNEL:-alpha}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Random suffix so the workflow can be run repeatedly at one version.
            SUFFIX=$(openssl rand -hex 4)
            if [ "$CHANNEL" = "stable" ]; then
              TAG="kino-v${VERSION}-${SUFFIX}"
            else
              TAG="kino-v${VERSION}-${CHANNEL}.${SUFFIX}"
            fi
          fi

          if [ "$CHANNEL" = "stable" ]; then PRERELEASE=false; else PRERELEASE=true; fi

          SLUG=""; [ "$CHANNEL" = "stable" ] || SLUG="-${CHANNEL}"
          IPA_NAME="kino-${VERSION}${SLUG}-ios-unsigned.ipa"

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "ipa_name=$IPA_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "tag:        $TAG"
          echo "prerelease: $PRERELEASE"
          echo "ipa:        $IPA_NAME"

      # Simulator first: it generates Generated.xcconfig and runs pod install
      # without tripping over the missing code-signing identity.
      - name: Prepare iOS build environment
        working-directory: scaffold
        run: flutter build ios --debug --simulator

      - name: Build unsigned release app
        working-directory: scaffold
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package into an unsigned IPA
        working-directory: scaffold
        env:
          IPA_NAME: ${{ steps.version.outputs.ipa_name }}
        run: |
          mkdir -p Payload
          mv build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r -q "$IPA_NAME" Payload

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.scaffold.outputs.artifact_name }}
          path: scaffold/${{ steps.version.outputs.ipa_name }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      ${{
        (github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && inputs.create_release != false)
      }}
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-ios.outputs.artifact_name }}
          path: release-files

      # The tag is created here, not left to the release action: a release
      # created against a tag that does not exist yet is aimed at the default
      # branch, which would tag the wrong commit.
      - name: Push the tag
        env:
          TAG: ${{ needs.build-ios.outputs.tag }}
        run: |
          git check-ref-format "refs/tags/$TAG"
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists."; exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-ios.outputs.tag }}
          name: kino ${{ needs.build-ios.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.build-ios.outputs.prerelease }}
          files: release-files/${{ needs.build-ios.outputs.ipa_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}